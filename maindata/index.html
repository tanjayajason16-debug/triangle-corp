<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Triangle Corp. Login</title>

  <link href="https://db.onlinewebfonts.com/c/2eccf178aa2ce410df13a179ba3b3761?family=Nexa-Book" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <!-- Animated Background (hidden until login completes) -->
  <div class="animated-bg hidden"></div>

  <div class="login-container">
    <img src="trianglelogo.png" alt="Triangle Corp. Logo" class="logo" />

    <form id="login-form">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">LOGIN</button>
    </form>

    <p id="message" class="message"></p>
  </div>

  <!-- Top Bar after login -->
  <div id="top-bar" class="top-bar hidden">
    <div class="left-side">
      <img src="trianglelogo.png" alt="Triangle Corp Logo" class="top-logo" />
      <span class="menu-text">Menu</span>
    </div>
    <div class="user-top-info">
      <img id="user-top-pic" src="profile.jpg" alt="Profile Picture" class="user-top-pic" />
      <span id="user-top-name" class="user-top-name"></span>
    </div>
  </div>

  <!-- Dashboard Panel (shown after login) -->
  <div id="dashboard" class="dashboard hidden">
    <div class="dash-content" id="dash-content">
      <div class="content-empty" id="content-empty">
        <span class="content-empty-arrow">←</span>
        <span>SELECT A MODULE</span>
      </div>
    </div>
    <nav class="dash-menu" id="dash-menu"></nav>
  </div>

  <footer>
    <span class="copy">&copy; 2025 Triangle Corp.</span>
    <a href="signup.html" class="signup-link">ⓘ How to sign up?</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
